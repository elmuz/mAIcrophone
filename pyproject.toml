[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maic"
version = "0.2.0"
description = "Local push-to-talk dictation for Niri, Sway, and Hyprland"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
]

[project.optional-dependencies]
# GTK/GI itself is provided by the distro (gtk4, python-gobject) and is an
# optional overlay dependency. pycairo is required by the overlay module.
overlay = [
    "pycairo>=1.20",
    "PyGObject>=3.42",
]

[project.scripts]
maic = "maic.cli:main"

[tool.setuptools.packages.find]
include = ["maic*"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
# Broad exception handling is deliberate at backend, subprocess, and
# cleanup boundaries where failures must not take down the daemon.
ignore = ["BLE001"]

[tool.ty.analysis]
# GTK/PyGObject and cairo are optional, distro-provided overlay dependencies.
allowed-unresolved-imports = ["gi.**", "cairo"]
