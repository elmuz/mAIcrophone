name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Type-check
        run: uv run --no-sync ty check

  compositor-smoke:
    name: Compositor smoke (Sway, Niri)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Run headless compositor smoke tests
        run: |
          set -euxo pipefail
          chmod -R a+rX "$GITHUB_WORKSPACE"
          docker run --rm --init --cap-add SYS_NICE --shm-size=1g \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE:/src:ro" \
            -w /src \
            archlinux:latest \
            bash -lc '
              set -euxo pipefail
              pacman -Syu --noconfirm --needed \
                bash coreutils shadow util-linux \
                python python-gobject python-cairo gtk4 ttf-dejavu \
                sway niri mesa libglvnd
              useradd -m tester
              runuser -u tester -- env PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=/src \
                python /src/tests/integration/compositor_smoke.py sway niri
            '

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run --no-sync python -m unittest discover -s tests -v
