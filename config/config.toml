[server]
# WebSocket endpoint of `nemo-speech serve`
url = "ws://127.0.0.1:8080/v1/audio/transcriptions/realtime"
# How often the daemon refreshes the overlay server indicator.
poll_seconds = 5

[backend]
# Current providers. Unknown names fail config validation at daemon startup.
compositor = "niri"         # niri | sway | hyprland | auto
audio = "pulse"             # pulse | pw-record
injection = "wtype"
# nemo-speech | openai-http | faster-whisper | whisper-cpp | batch-http
asr = "nemo-speech"
overlay = "gtk"             # gtk | null

[audio]
# Empty = PipeWire default source. Otherwise a source name from `wpctl status`.
source = ""
sample_rate = 16000
chunk_ms = 100

[asr]
# Per-session language. Use "auto" for model-based detection.
language = "en-US"
punctuation = true

# Batch (non-streaming) engines buffer audio and transcribe when you stop.
# selected with backend.asr = "openai-http" / "faster-whisper" / "whisper-cpp"
# / "batch-http". Leave batch_url empty to use server.url when it is HTTP(S);
# otherwise the provider uses a protocol default (127.0.0.1:8081 for OpenAI-
# compatible servers, 127.0.0.1:8080/inference for whisper.cpp).
# batch_url = "http://127.0.0.1:8081/v1/audio/transcriptions"
# batch_ready_url = "http://127.0.0.1:8081/"
# batch_protocol = "openai"   # openai | whisper-cpp
# batch_model = "whisper-1"
# batch_timeout = 60.0

[overlay]
enabled = true
width_percent = 67
max_width_px = 1000
max_height_percent = 30
margin_px = 56
font = "FiraCode Nerd Font Mono 13"
max_lines = 10
min_font_size = 11
font_steps = 3
corner_radius = 16
border_width = 3
background_opacity = 0.93

[overlay.colors]
# CSS hex colors: #RGB, #RGBA, #RRGGBB, or #RRGGBBAA.
background = "#2E3440"   # overlay background (combined with background_opacity)
border = "#4C566A"       # window border
# text = "#ECEFF4"       # stable/final transcript
# partial = "#81A1C1"    # live partial transcript
# accent = "#88C0D0"     # waveform, caret, language pill
# divider = "#3B4252"    # header divider
# success = "#A3BE8C"    # server online
# warning = "#EBCB8B"    # stopping / checking
# error = "#BF616A"      # recording indicator and errors
# cancel = "#D08770"     # cancelling state

[injection]
# wtype | clipboard | both (copy_to_clipboard controls the clipboard side)
method = "wtype"
copy_to_clipboard = true
primary_selection = true
return_to_target = true
multiline = "space"          # space | shift-enter | clipboard
long_text_threshold = 400

[replacements]
"Pipewire" = "PipeWire"
"Pypewaier" = "PipeWire"
"System D" = "systemd"
"System di" = "systemd"
"Enemmotron" = "Nemotron"
"Nemotrone" = "Nemotron"
"Vtype" = "wtype"
